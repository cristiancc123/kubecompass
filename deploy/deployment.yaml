apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            # app-credentials is created by hand in Radar, outside git and Argo CD.
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-url
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-api-key
            # Telemetry to Dash0. Without the token the app runs with telemetry off.
            - name: DASH0_OTLP_ENDPOINT
              value: https://ingress.us-west-2.aws.dash0.com
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-auth-token
                  optional: true
            # Kubernetes identity on every span, metric and log record.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME),k8s.deployment.name=app,k8s.cluster.name=kubecompass,deployment.environment.name=hackathon
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
